name: Post-trade 10M benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production and benchmark dependencies
        run: pip install -e ".[dev,executor,roaring]"
      - name: Run deterministic 10M benchmark
        run: |
          set -o pipefail
          python benchmarks/post_trade_benchmark.py \
          --rows 10000000 \
          --db post-trade-10m.duckdb \
          --output post-trade-10m.json \
          2>&1 | tee post-trade-10m.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-trade-10m
          path: |
            post-trade-10m.json
            post-trade-10m.log
